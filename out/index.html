<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Python Docs" />
    <title>Python Docs</title>

    <style>
        /* Default Styles */

        :root {
            --color-bg: #ffffff;
            --color-surface: #f4f6f8;
            --color-text: #1a2533;
            --color-muted: #49566b;
            --color-accent: #1a56db;
            --color-border: #d8dee6;
            --color-code-bg: #f0f2f5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #0f1720;
                --color-surface: #16202b;
                --color-text: #e6e9ee;
                --color-muted: #9aa7b6;
                --color-accent: #7cb3ff;
                --color-border: #2b3746;
                --color-code-bg: #16202b;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--color-bg);
            color: var(--color-text);
        }
    </style>
</head>

<body>



    <main>
        <h1>Python Docs</h1>

        <ul>


            <li>
                <a href="demo">
                    demo
                </a>

                <span class="kind">
                    Module
                </span>


                <ul>


                    <li>
                        <a href="demo.MyClass">
                            demo.MyClass
                        </a>

                        <span class="kind">
                            Class
                        </span>


                        <ul>


                            <li>
                                <a href="demo.MyClass.__init__">
                                    demo.MyClass.__init__
                                </a>

                                <span class="kind">
                                    Function
                                </span>


                            </li>



                            <li>
                                <a href="demo.MyClass.do_something">
                                    demo.MyClass.do_something
                                </a>

                                <span class="kind">
                                    Function
                                </span>


                            </li>


                        </ul>

                    </li>


                </ul>

            </li>


        </ul>
    </main>

</body>

</html>
